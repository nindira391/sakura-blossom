<html>
        <head><title>Downloaded HTML</title></head>
        <body>
            <pre style="white-space: pre-wrap; word-wrap: break-word;"><!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Music</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #ffd6e8, #ffe8f2, #ffc2e2);
    color: #4a1f2e;
    overflow-x: hidden;
    position: relative;
  }

  /* Sakura Effect */
 .sakura {
    position: fixed;
    top: -10%;
    color: #ffb6c1;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    font-size: 18px;
    opacity: 0.8;
    z-index: 1;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg) translateX(0);
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(360deg) translateX(100px);
      opacity: 0;
    }
  }

  header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
    z-index: 2;
  }

  header h1 {
    font-size: 3rem;
    color: #d63384;
    text-shadow: 2px 2px 10px rgba(214, 51, 132, 0.3);
  }

  header p {
    font-size: 1.1rem;
    color: #8a4a63;
    margin-top: 8px;
  }

  /* Slider */
 .slider {
    position: relative;
    max-width: 900px;
    margin: 40px auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(214, 51, 132, 0.25);
    z-index: 2;
  }

 .slides {
    display: flex;
    transition: transform 0.8s ease-in-out;
  }

 .slides img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    flex-shrink: 0;
  }

 .dots {
    text-align: center;
    margin: 15px 0 40px;
    position: relative;
    z-index: 2;
  }

 .dot {
    height: 12px;
    width: 12px;
    margin: 0 6px;
    background-color: #f8b6d2;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    transition: background-color 0.3s;
  }

 .dot.active,.dot:hover {
    background-color: #d63384;
  }

  /* Music Player */
 .player {
    text-align: center;
    padding: 30px 20px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    max-width: 600px;
    margin: 0 auto 60px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(214, 51, 132, 0.2);
    position: relative;
    z-index: 2;
  }

 .player h2 {
    color: #d63384;
    margin-bottom: 15px;
  }

  audio {
    width: 100%;
    outline: none;
    border-radius: 12px;
  }

  button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #d63384;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #b82a6f;
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
   .slides img { height: 300px; }
    header h1 { font-size: 2rem; }
   .sakura { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- Sakura Container -->
<div id="sakura-container"></div>

<header>
  <h1>Voice Music</h1>
  <p>Rasakan musik dengan suasana pink yang lembut</p>
</header>

<!-- Slide Foto -->
<div class="slider">
  <div class="slides" id="slides">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=900" alt="Music 1">
    <img src="https://images.unsplash.com/photo-1493225457124-a3a574efd240?w=900" alt="Music 2">
    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b5d7?w=900" alt="Music 3">
  </div>
</div>

<div class="dots">
  <span class="dot active" onclick="currentSlide(0)"></span>
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
</div>

<!-- Player Musik -->
<div class="player">
  <h2>🎵 Now Playing: Chill Vibes</h2>
  <audio controls>
    <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" type="audio/mpeg">
    Browser kamu tidak support audio.
  </audio>
  <button onclick="alert('Fitur download coming soon!')">Download Lagu</button>
</div>

<script>
  // Slider Script
  let slideIndex = 0;
  const slides = document.getElementById('slides');
  const dots = document.querySelectorAll('.dot');
  const totalSlides = dots.length;

  function showSlide(index) {
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove('active'));
    dots[index].classList.add('active');
  }

  function currentSlide(index) {
    slideIndex = index;
    showSlide(slideIndex);
  }

  setInterval(() => {
    slideIndex = (slideIndex + 1) % totalSlides;
    showSlide(slideIndex);
  }, 4000);

  // Sakura Falling Effect
  const container = document.getElementById('sakura-container');
  const sakuraCount = 35;

  for (let i = 0; i < sakuraCount; i++) {
    let sakura = document.createElement('div');
    sakura.classList.add('sakura');
    sakura.innerHTML = '❀';

    // Random posisi, ukuran, kecepatan, delay
    sakura.style.left = Math.random() * 100 + 'vw';
    sakura.style.animationDuration = Math.random() * 5 + 7 + 's';
    sakura.style.animationDelay = Math.random() * 5 + 's';
    sakura.style.fontSize = Math.random() * 10 + 12 + 'px';
    sakura.style.opacity = Math.random() * 0.5 + 0.5;

    container.appendChild(sakura);
  }
</script>

</body>
</html></pre>
